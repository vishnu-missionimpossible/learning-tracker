<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Tracker - Production</title>
    <link rel="stylesheet" href="src/css/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
<body>
    <!-- Main Container -->
    <div id="app-root"></div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"></script>

    <!-- Flatpickr (Date Picker) -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

    <!-- Application Modules - CORRECT ORDER IS IMPORTANT! -->
    <!-- 1. Firebase config must load FIRST -->
    <script src="config/firebase.js"></script>

    <!-- 2. Utilities (no dependencies) -->
    <script src="src/js/utils.js"></script>

    <!-- 3. Auth module (uses auth from firebase.js) -->
    <script src="src/js/auth.js"></script>

    <!-- 4. Manager modules (use db from firebase.js) -->
    <script src="src/js/courseManager.js"></script>
    <script src="src/js/metricsManager.js"></script>

    <!-- 5. UI module (uses managers) -->
    <script src="src/js/ui.js"></script>

    <!-- 6. App controller (orchestrates everything) -->
    <script src="src/js/app.js"></script>
</body>
</html>
