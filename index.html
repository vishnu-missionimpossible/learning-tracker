<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Security: Content-Security-Policy. Inline scripts are allowed only because the UI uses inline click handlers; all handler arguments are escaped via Utils.js(). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://cdn.jsdelivr.net https://apis.google.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://img.youtube.com https://www.google.com https://*.gstatic.com https://*.googleusercontent.com; font-src 'self' data:; connect-src 'self' https://cdn.jsdelivr.net https://www.gstatic.com https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebaseapp.com; frame-src https://*.firebaseapp.com https://accounts.google.com https://apis.google.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <script src="src/js/security.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Tracker - Production</title>
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LearnTrack">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="stylesheet" href="src/css/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">
</head>
<body>
    <!-- Main Container -->
    <div id="app-root"></div>

    <!-- Firebase SDK - COMPAT VERSION (FIXED!) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>

    <!-- Flatpickr (Date Picker) -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>

    <!-- Chart.js (charts) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    <!-- Application Modules - CORRECT ORDER -->
    <!-- 1. Firebase config must load FIRST -->
    <script src="config/firebase.js"></script>

    <!-- 2. Utilities (no dependencies) -->
    <script src="src/js/utils.js"></script>
    <script src="src/js/fun.js"></script>
    <script src="src/js/analytics.js"></script>
    <script src="src/js/profile.js"></script>
    <script src="src/js/timer.js"></script>
    <script src="src/js/settings.js"></script>

    <!-- 3. Auth module (uses auth from firebase.js) -->
    <script src="src/js/auth.js"></script>

    <!-- 4. Manager modules (use db from firebase.js) -->
    <script src="src/js/courseManager.js"></script>
    <script src="src/js/shareManager.js"></script>
    <script src="src/js/metricsManager.js"></script>

    <!-- 5. UI module (uses managers) -->
    <script src="src/js/resources.js"></script>
    <script src="src/js/chat.js"></script>
    <script src="src/js/flashcards.js"></script>
    <script src="src/js/journal.js"></script>
    <script src="src/js/buddy.js"></script>
    <script src="src/js/ui.js"></script>
    <script src="src/js/views.js"></script>

    <!-- 6. App controller (orchestrates everything) -->
    <script src="src/js/app.js"></script>
    <script src="src/js/appExtra.js"></script>
</body>
</html>
